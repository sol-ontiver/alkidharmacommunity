[package]
name = "sol-cli"
version = "0.1.0"
edition = "2024"
authors = ["Sol Ontiveros"]
description = "A collection of Linux command line utilities customized for my use"

[[bin]]
name = "sol-cli"
path = "src/sol_cli.rs"

[dependencies]
atty = "0.2"
arboard = "3"
clap = { version = "4.5.53", features = ["derive"] }
chrono = "0.4"
dirs = "4.0"
env_logger = "0.11"
log = "0.4"
termimad = "0.34.1"
