[package]
name = "sol-cli"
version = "0.1.0"
edition = "2024"
authors = ["Sol Ontiveros"]
description = "A collection of Linux command line utilities customized for my use"

[[bin]]
name = "sol-cli"
path = "src/sol_cli.rs"

[dependencies]
atty = "0.2"
arboard = "3"
clap = { version = "4.5.53", features = ["derive"] }
chrono = "0.4"
dirs = "4.0"
env_logger = "0.11"
log = "0.4"
quick-xml = "0.40.1"
reqwest = { version = "0.13.3", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
termimad = "0.34.1"
toml = "0.9"
